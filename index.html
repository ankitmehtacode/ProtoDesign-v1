<!doctype html>
<!-- The site is dark only: every page uses the .dark tokens in src/index.css. -->
<html lang="en-IN" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1511" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">

    <meta property="og:site_name" content="ProtoDesign" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Per-page tags. scripts/prerender.mjs replaces everything between these
      markers for each route at build time (from src/seo/site.js). In dev the
      app sets them at runtime. data-rh lets react-helmet-async take them over.
    -->
    <!--seo:start-->
    <title>3D Printing Service &amp; 3D Printers in India | ProtoDesign</title>
    <meta data-rh="true" name="description" content="Instant 3D printing quotes: upload an STL or OBJ file, printed in PLA, PETG or ABS and delivered across India. Shop 3D printers and filament too." />
    <!--seo:end-->
  </head>

  <body>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
